services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_esta_clave}
      POSTGRES_DB: radar
    ports:
      - "5432:5432"
    volumes:
      - radar_datos:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed_zonas.sql:/docker-entrypoint-initdb.d/02_seed_zonas.sql:ro

volumes:
  radar_datos:
